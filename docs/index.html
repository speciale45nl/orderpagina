<style>
  /* Layout: wie-ben-je als eerste scherm, daarna één kolom: kop met voortgang, opdracht, de eigen stappen, opmerkingen. */
  :root{

  .photos .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .photos .ph span{position:absolute;left:0;right:0;bottom:0;font-size:10.5px;padding:2px 5px;background:rgba(0,0,0,.55);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .photos .ph .weg{position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:18px;line-height:26px;padding:0;cursor:pointer}
  .photos .ph .bevestig{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:rgba(0,0,0,.72)}
  .photos .ph .bevestig button{border:0;border-radius:8px;padding:5px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
  .photos .ph .bevestig .ja{background:var(--bad);color:#fff} .photos .ph .bevestig .nee{background:#fff;color:#222}
  .btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-strong);background:var(--paper);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:15px;font-weight:600;min-height:46px}
  .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .btn.photo{border-style:dashed}
  .hint{font-size:13px;color:var(--muted)}

  .log .logform{padding:12px 16px 4px}
  .log .logbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .btn.danger{background:var(--bad-bg);color:var(--bad);border-color:transparent}
  .log textarea{width:100%;min-height:64px;border:1px solid var(--line-strong);border-radius:10px;padding:9px 12px;font:inherit;font-size:16px;background:var(--paper);color:var(--ink);resize:vertical}
  .entries{list-style:none;margin:0;padding:4px 16px 12px}
  .entries li{padding:9px 0;border-top:1px solid var(--line);font-size:15px}
  .entries li:first-child{border-top:0}
  .entries .meta{font-size:12.5px;color:var(--muted);margin-bottom:2px}

  .orders{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:10px}
  .orders a{display:block;text-decoration:none;background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px}
  .orders .row{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
  .orders .klant{font-weight:700;font-size:17px}
  .orders .sub{font-size:14px;color:var(--muted);margin-top:4px}
  .orders .mini{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;margin-top:10px}
  .orders .mini span{height:5px;border-radius:3px;background:var(--line)}
  .orders .mini span.done{background:var(--ok)}
  .orders .mini span.cur{background:var(--warn)}

  .tools{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line)}
  .qr{display:none;padding:14px 16px;border-top:1px solid var(--line);text-align:center}
  .qr.open{display:block}
  .qr .box{display:inline-block;background:#fff;padding:12px;border-radius:10px}
  .qr .url{font-size:12px;color:var(--muted);word-break:break-all;margin-top:8px}

  .alarm{margin-top:14px;padding:10px 14px;border-radius:10px;background:var(--bad-bg);color:var(--bad);font-weight:600;font-size:14.5px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
  .alarm .btn{min-height:36px;padding:6px 12px;font-size:13.5px}
  .alarm.wijziging{background:var(--warn-bg);color:var(--warn)}
  .wijz{margin-top:10px;padding:8px 12px;border-radius:8px;border:1px dashed var(--line-strong);font-size:13.5px}
  .wijz .meta{color:var(--muted);font-size:12.5px}
  .wijz .ok{color:var(--ok)}
  .wijz .nee{color:var(--bad);font-weight:600}
  .pill.bad{background:var(--bad-bg);color:var(--bad)}
  .pill.wacht{background:var(--accent-soft);color:var(--ink)}
  .orders .flags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .items label.locked{opacity:.55}
  .log .soort{display:flex;gap:14px;font-size:14px;padding:0 16px 8px;color:var(--muted)}
  .log .soort label{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
  .entries li.probleem{background:var(--bad-bg);margin:0 -16px;padding-left:16px;padding-right:16px}
  .entries li.probleem.opgelost{background:transparent;opacity:.7}
  .entries .acties{margin-top:6px}
  .ref{font-size:13.5px;color:var(--muted);margin-top:4px}
  .empty{margin-top:24px;padding:24px 16px;text-align:center;color:var(--muted);background:var(--paper);border:1px dashed var(--line-strong);border-radius:14px}
  .toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s;max-width:92vw}
  .toast.show{opacity:1}
  @media (prefers-reduced-motion:reduce){.toast{transition:none}}
  @media (max-width:420px){.top h1{font-size:19px}.items label{padding:12px 12px}.card .bd,.card .hd{padding-left:12px;padding-right:12px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top" id="top">
    <div class="top-inner" id="topInner">
      <div class="top-row"><a class="brand" href="#" id="home">Spéciale45</a><a class="back" href="#" id="back" hidden>‹ Alle orders</a><button type="button" id="rolTag" class="rol" hidden title="Twee keer tikken om uit te loggen"></button></div>
      <h1 id="title">Orders</h1>
      <div class="sub" id="subtitle"></div>
    </div>
  </header>
  <div id="banners"></div>
  <main id="main"><div class="empty">Laden…</div></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  'use strict';
  const ROLES=['1stop','Interieurspecialist','Spéciale45'];
  const EMAILS={'1stop':'1stop@orders.speciale45.nl','Interieurspecialist':'interieur@orders.speciale45.nl','Spéciale45':'beheer@orders.speciale45.nl'};
  const rolVanEmail=e=>{ for(const r in EMAILS){ if(EMAILS[r]===e) return r; } return ''; };
  const S={ db:null,authReady:false,canWrite:true,readOnly:false,loginRol:'',
            role:'',name:'',uid:null,
            orders:[],order:null,orderId:null, checks:{},photos:[],log:[], unsub:[], qrOpen:false,
            aanmeldingen:[], rollen:{}, toggled:{}, voorraad:{}, tel:{}, route:null, routeKey:'', tags:{}, voertuigen:{}, tagDoc:undefined, view:'', tab:(function(){ try{ return localStorage.getItem('s45tab')||'orders'; }catch(e){ return 'orders'; } })(), lijst:null, zoekV:'', open:{}, fotoWeg:null, bewerk:null, vzFilter:'', nieuwAuto:false, voertuigenGeladen:false };
  const kKey=k=>String(k||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  const tagVan=(kenteken,meldcode)=>{ const key=kKey(kenteken); for(const nn in S.tags){ const t=S.tags[nn]; if(key&&kKey(t.kenteken)===key) return nn; if(!key&&meldcode&&!kKey(t.kenteken)&&t.meldcode===meldcode) return nn; } return ''; };
  const autoLabel=o=>o.kenteken||(o.meldcode?'Meldcode '+o.meldcode:(o.klant||'—'));
  const PARTS=[{id:'marshall',naam:'Marshall speakers',min:2},{id:'speakerband',naam:'Speakerbanden',min:2},{id:'oplader',naam:'Opladers (oplaadstuk laadpaal)',min:2}];
  const partNaam=id=>{ const x=PARTS.find(p=>p.id===id); return x?x.naam:id; };
  const $=id=>document.getElementById(id);
  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const MND=['jan','feb','mrt','apr','mei','jun','jul','aug','sept','okt','nov','dec'];
  const fmt=iso=>{ if(!iso) return ''; const d=new Date(iso); if(isNaN(d)) return ''; const p=n=>String(n).padStart(2,'0'); return `${d.getDate()} ${MND[d.getMonth()]} ${p(d.getHours())}:${p(d.getMinutes())}`; };
  const fmtD=iso=>{ if(!iso) return ''; const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso); if(!m) return iso; return `${+m[3]} ${MND[+m[2]-1]} ${m[1]}`; };
  const daysAgo=iso=>{ if(!iso) return null; const d=new Date(iso); if(isNaN(d)) return null; return Math.floor((Date.now()-d.getTime())/864e5); };
  const daysUntil=iso=>{ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||''); if(!m) return null; const t=new Date(+m[1],+m[2]-1,+m[3]); const n=new Date(); n.setHours(0,0,0,0); return Math.round((t-n)/864e5); };
  function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2600); }
  const who=()=>S.name?`${S.role} (${S.name})`:S.role;
  const isS45=()=>S.role==='Spéciale45';
  const isInt=()=>S.role==='Interieurspecialist';

  function parseHash(){ const h=(location.hash||'').replace(/^#/,'').trim(); if(!h) return null;
    let m=/^t(\d{1,3})$/i.exec(h); if(m) return {tag:m[1].padStart(2,'0')};
    if(/^\d{4}$/.test(h)) return {meldcode:h};
    if(/^\d{5,8}$/.test(h)) return {order:h};
    if(/^[A-Za-z0-9-]{4,12}$/.test(h)) return {kenteken:kKey(h)};
    return null; }
  function resetOrderState(){ S.order=null; S.checks={}; S.photos=[]; S.log=[]; S.qrOpen=false; S.fotoWeg=null; S.toggled={}; S.tagDoc=undefined; S.view=''; }
  function goHome(){ if(location.hash){ location.hash=''; } S.route=null; S.routeKey=''; S.orderId=null; resetOrderState(); subscribe(); render(); }
  $('home').addEventListener('click',e=>{ e.preventDefault(); goHome(); });
  function route(){
    const r=parseHash(), key=JSON.stringify(r);
    if(key!==S.routeKey){ S.route=r; S.routeKey=key; S.orderId=r&&r.order?r.order:null; resetOrderState(); subscribe(); }
    render();
  }
  window.addEventListener('hashchange',route);

  // ── afgeleide status ──
  const mySteps=o=>(o.stappen||[]).filter(st=>isS45()||st.wie===S.role);
  function stepDone(st,checks){ const it=st.items||[]; return it.length>0 && it.every(i=>checks[i.id]&&checks[i.id].done); }
  function progress(steps,checks){
    const states=steps.map(st=>stepDone(st,checks));
    return {states, cur:states.findIndex(x=>!x), done:states.filter(Boolean).length, total:steps.length, steps};
  }
  const FOTO_LABELS={spuitwerk:'Snelle foto spuitwerk',montage:'Snelle interieurfoto',afleveren:'Afleverfoto voor insta',interieur:'Snelle foto van de set'};
  const fotoLabel=st=>st.fotoLabel||FOTO_LABELS[st.id]||'Foto maken';
  function fotosOk(o,st,photos){ const need=st.vereistFotoVan||[]; return need.every(id=>photos.some(f=>f.stap===id)); }
  function stappenOk(o,st,checks){ const need=st.vereistStappen||[]; return need.every(id=>{ const x=(o.stappen||[]).find(y=>y.id===id); return x&&stepDone(x,checks); }); }
  const WIJZ_VOOR=['1stop','Interieurspecialist'];
  const wijzId=(w,rol)=>'w-'+w.id+'-'+rol;
  const wijzGezien=(checks,w,rol)=>{ const c=checks[wijzId(w,rol)]; return !!(c&&c.done); };
  function wijzVoorMij(o){ return (o.wijzigingen||[]).filter(w=>isS45()||(w.voor||WIJZ_VOOR).includes(S.role)); }
  function ongezienDoor(o,checks){ const r=new Set(); (o.wijzigingen||[]).forEach(w=>(w.voor||WIJZ_VOOR).forEach(rol=>{ if(!wijzGezien(checks,w,rol)) r.add(rol); })); return [...r]; }
  function stapNaam(o,id){ const x=(o.stappen||[]).find(y=>y.id===id); return x?x.titel.toLowerCase():id; }
  function stapWie(o,id){ const x=(o.stappen||[]).find(y=>y.id===id); return x?x.wie:''; }
  function curVoor(o,checks,photos,wie){ // eerste open stap van deze partij, en of die nog geblokkeerd is
    const st=(o.stappen||[]).filter(x=>x.wie===wie).find(x=>!stepDone(x,checks)); if(!st) return null;
    return {wie, id:st.id, titel:st.titel, locked:!fotosOk(o,st,photos)||!stappenOk(o,st,checks)};
  }
  function statusVan(o){ // voor het overzicht van Spéciale45
    const all=o.stappen||[], checks=o._checks||{}, photos=o._photos||[], p=progress(all,checks);
    const open=(o._log||[]).filter(e=>e.probleem&&!e.opgelost).length;
    const acts=[...Object.values(checks).map(c=>c.at),...(o._log||[]).map(e=>e.at)].filter(Boolean).sort();
    const last=acts.length?acts[acts.length-1]:null;
    const isDone=id=>{ const x=all.find(y=>y.id===id); return !!x&&stepDone(x,checks); };
    const bezig=ROLES.map(w=>curVoor(o,checks,photos,w)).filter(Boolean);
    const klaar=isDone('klaar'), regelen=all.find(x=>x.id==='aflevering-regelen');
    return {p, open, last, klaar, controle:klaar&&!!regelen&&!stepDone(regelen,checks), afgeleverd:isDone('afleveren'), bezig, ongezien:ongezienDoor(o,checks), dagen:daysAgo(last)};
  }

  function setTop(title,sub,prog){
    const m=/<a class="back"[^>]*>.*?<\/a>/.exec(sub||''); // terugknop uit de subregel halen en linksboven zetten
    if(m) sub=sub.replace(m[0],'');
    $('title').textContent=title; $('subtitle').innerHTML=sub; $('subtitle').hidden=!sub;
    const brand=$('home'), back=$('back'); const lbl=isS45()&&S.tab==='voorraad'?'Voorraad':'Alle orders';
    brand.hidden=!!m; back.hidden=!m; back.textContent='‹ '+lbl;
    const tag=$('rolTag'); tag.hidden=!S.role; tag.textContent=S.role;
    const old=$('progWrap'); if(old) old.remove();
    if(prog&&prog.total){
      const w=document.createElement('div'); w.id='progWrap';
      w.innerHTML=`<div class="prog">${prog.states.map((d,i)=>`<span class="${d?'done':(i===prog.cur?'cur':'')}"></span>`).join('')}</div>
        <div class="prog-label"><span>${prog.done} van ${prog.total} klaar</span><span>${prog.cur<0?'Alles klaar':esc(prog.label||prog.steps[prog.cur].titel)}</span></div>`;
      $('topInner').appendChild(w);
    }
  }
  function renderBanners(){
    const b=$('banners'); b.innerHTML=(S.readOnly||S.canWrite===false)?`<div class="banner"><b>Je kunt meekijken maar niet afvinken.</b> Log opnieuw in.</div>`:'';
  }
  function renderLogin(main){
    setTop('Orderpagina','Spéciale45 · werkplaats',null);
    main.innerHTML=`<section class="card login"><div class="hd"><h2>Wie ben je?</h2></div><div class="bd">
      <div class="rollen">${ROLES.map(r=>`<button type="button" data-rol="${esc(r)}" class="${S.loginRol===r?'aan':''}">${esc(r)}</button>`).join('')}</div>
      <label for="pin"><b>Pincode</b> <span class="hint">(4 cijfers)</span></label>
      <div class="pin"><input id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="one-time-code" aria-label="Pincode"><button type="button" class="btn primary" id="loginBtn">Inloggen</button></div>
      <div id="loginMsg" class="hint" style="margin-top:10px;min-height:18px"></div>
      <div class="hint" style="margin-top:14px">Eén keer inloggen is genoeg; deze telefoon blijft daarna ingelogd. Zet de pagina op je beginscherm via "Delen" → "Zet op beginscherm".</div>
    </div></section>`;
    if(S.loginRol){ const p=$('pin'); if(p) p.focus(); }
  }
  async function login(){
    const pin=($('pin').value||'').replace(/\D/g,''); const msg=$('loginMsg');
    if(!S.loginRol){ msg.textContent='Kies eerst wie je bent.'; return; }
    if(pin.length!==4){ msg.textContent='Typ de 4 cijfers van je pincode.'; return; }
    msg.textContent='Even geduld…';
    try{ await firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL); await firebase.auth().signInWithEmailAndPassword(EMAILS[S.loginRol],'pin-'+pin+'-s45'); }
    catch(err){ msg.textContent=(err&&/password|credential|user-not-found|invalid/i.test(err.code||''))?'Pincode klopt niet. Probeer opnieuw.':'Inloggen lukt niet: '+(err&&err.code||'onbekend'); }
  }

  function render(){
    renderBanners();
    const main=$('main');
    if(!S.authReady){ setTop('Laden…','',null); main.innerHTML='<div class="empty">Laden…</div>'; return; }
    if(!S.role){ renderLogin(main); return; }
    if(!S.route){ renderList(main); return; }
    if(!S.orderId){ renderResolve(main); return; }
    if(!S.order){ setTop('Order '+S.orderId,'<a class="back" href="#" id="back">← Alle orders</a>',null); main.innerHTML='<div class="empty">Order wordt geladen…</div>'; return; }
    renderOrder(main);
  }

  function renderList(main){
    if(isS45()&&S.tab==='voorraad'){ renderVoorraad(main); return; }
    setTop('Orders', isS45()?'Alle auto\'s in bewerking':'Auto\'s met werk voor jou', null);
    let list=S.orders.filter(o=>mySteps(o).length).map(o=>Object.assign({_st:statusVan(o)},o));
    list.sort((a,b)=>(b._st.open-a._st.open)||((b._st.controle?1:0)-(a._st.controle?1:0))||((daysUntil(a.deadline)??9999)-(daysUntil(b.deadline)??9999)));
    let h = isS45()?tabsHtml():'';
    h += isInt()?'':`<form class="snel" id="snelForm"><label for="snelTag">Stickernummer of meldcode <span class="hint" style="font-weight:500">(sticker: 2 cijfers · meldcode: 4 cijfers)</span></label><input id="snelTag" inputmode="numeric" placeholder="07" aria-label="Stickernummer, meldcode of kenteken"><button type="submit" class="btn primary">Open</button></form>`;
    h += !list.length ? '<div class="empty">Geen orders voor jou op dit moment.</div>' :
      `<ul class="orders">${list.map(o=>{ const st=mySteps(o), p=progress(st,o._checks||{}), x=o._st, du=daysUntil(o.deadline);
      const pills=[];
      if(x.open) pills.push(`<span class="pill bad">⚠ ${x.open} probleem${x.open>1?'en':''}</span>`);
      if(isS45()&&x.ongezien.length) pills.push(`<span class="pill bad">✎ wijziging niet gezien: ${esc(x.ongezien.join(', '))}</span>`);
      if(!isS45()&&wijzVoorMij(o).some(w=>!wijzGezien(o._checks||{},w,S.role))) pills.push('<span class="pill bad">✎ gewijzigd, bekijk</span>');
      if(isS45()){
        if(p.cur<0||x.afgeleverd) pills.push('<span class="pill ok">Afgeleverd</span>');
        else {
          if(x.controle) pills.push('<span class="pill cur">✓ Klaar bij 1stop · jouw akkoord nodig</span>'); else if(x.klaar) pills.push('<span class="pill ok">Klaar bij 1stop</span>');
          const lopend=x.bezig.filter(b=>!b.locked);
          lopend.forEach(b=>pills.push(`<span class="pill ${b.wie==='Spéciale45'?'cur':'wacht'}">${b.wie==='Spéciale45'?'Jij':esc(b.wie)} · ${esc(b.titel)}</span>`));
          if(!lopend.length&&!x.klaar) pills.push('<span class="pill todo">Wacht</span>');
        }
      } else if(p.cur<0) pills.push('<span class="pill ok">Jouw werk klaar</span>'); else { const mijn=curVoor(o,o._checks||{},o._photos||[],S.role); if(mijn&&mijn.locked){ const stp=(o.stappen||[]).find(y=>y.id===mijn.id); const wie=(stp.vereistStappen||[]).map(id=>stapWie(o,id)).filter(Boolean)[0]; pills.push(`<span class="pill todo">${wie?'Wacht op '+esc(wie):'Eerst foto\'s'} · ${esc(mijn.titel)}</span>`); } else pills.push(`<span class="pill cur">${esc(st[p.cur].titel)}</span>`); }
      if(o.deadline) pills.push(`<span class="pill ${du!==null&&du<=3?'bad':'todo'}">klaar vóór ${esc(fmtD(o.deadline))}${du!==null?(du<0?' · te laat':` · ${du} dg`):''}</span>`);
      if(isS45()&&x.dagen!==null&&x.dagen>=3) pills.push(`<span class="pill todo">${x.dagen} dagen stil</span>`);
      const nn=isInt()?'':tagVan(o.kenteken,o.meldcode);
      return `<li><a href="#${esc(o.nummer)}"><div class="row"><span class="klant">${nn?`<span class="tagnr">${esc(nn)}</span>`:''}${isInt()?esc(o.klant):esc(autoLabel(o))+' · '+esc(o.model||'')}</span></div>
        <div class="sub">${isInt()?'order '+esc(o.nummer):esc(o.klant)+' · meldcode '+esc(o.meldcode||'—')+' · order '+esc(o.nummer)}</div>
        <div class="flags">${pills.join('')}</div>
        <div class="mini">${p.states.map((d,i)=>`<span class="${d?'done':(i===p.cur?'cur':'')}"></span>`).join('')}</div></a></li>`; }).join('')}</ul>`;
    if(S.role==='1stop'||isS45()) h+=voorraadKaart();
    if(isS45()) h+=`<section class="card"><div class="hd"><h2>Beheer</h2><span class="hint">Orders en auto's uit de chat inlezen</span></div><div class="bd">
      <textarea id="importJson" placeholder='Plak hier de tekst die Claude je geeft (begint met { "orders": … )' style="width:100%;min-height:90px;border:1px solid var(--line-strong);border-radius:10px;padding:9px 12px;font:inherit;font-size:16px;background:var(--paper);color:var(--ink)"></textarea>
      <div class="logbtns"><button type="button" class="btn primary" id="importBtn">Inlezen</button><span id="importMsg" class="hint"></span></div></div></section>`;
    if(false){
      const rows=[];

  function koppelZoek(){ // meldcode → auto

    const tm=e.target.closest('button[data-tel-min],button[data-tel-plus]');
    if(tm){ const id=tm.dataset.telMin||tm.dataset.telPlus; const inp=document.querySelector('input[data-tel="'+id+'"]'); if(!inp) return; const cur=inp.value===''?0:Number(inp.value); const n=Math.max(0,cur+(tm.dataset.telMin?-1:1)); inp.value=n; await zetVoorraad(id,n); return; }
    const ts=e.target.closest('button[data-telsave]');
    if(ts){ const box=ts.closest('.telvraag'); const inputs=[...box.querySelectorAll('input[data-telvraag]')]; for(const inp of inputs){ if(inp.value!=='') await zetVoorraad(inp.dataset.telvraag,inp.value); } delete S.tel[ts.dataset.telsave]; render(); return; }
    const tl=e.target.closest('button[data-tellater]');
    if(tl){ delete S.tel[tl.dataset.tellater]; render(); return; }
    const ak=e.target.closest('button[data-akkoord]');
    if(ak){ try{ await S.db.doc('orders/'+S.orderId+'/checks/'+ak.dataset.akkoord).set({done:true,by:who(),uid:S.uid,at:new Date().toISOString()}); toast('Akkoord gegeven'); }catch(err){ fail(err); } return; }
    const fw=e.target.closest('button[data-fotoweg]'); if(fw){ S.fotoWeg=fw.dataset.fotoweg; render(); return; }
    if(e.target.closest('button[data-fotonee]')){ S.fotoWeg=null; render(); return; }
    const fj=e.target.closest('button[data-fotoja]'); if(fj){ S.fotoWeg=null; try{ await S.db.doc('orders/'+S.orderId+'/photos/'+fj.dataset.fotoja).delete(); toast('Foto verwijderd'); }catch(err){ fail(err); } return; }
    const sc=e.target.closest('.nudoen[data-scroll]');
    if(sc){ const el=$('stap-'+sc.dataset.scroll); if(el){ el.scrollIntoView({behavior:'smooth',block:'start'}); } return; }
    const tg=e.target.closest('.hd[data-toggle]');
    if(tg){ const id=tg.dataset.toggle; const sec=tg.closest('.step'); const nu=sec.classList.contains('dicht'); S.toggled[id]=nu; sec.classList.toggle('dicht',!nu); const body=sec.querySelector('.stepbody'); if(body) body.hidden=!nu; const ch=tg.querySelector('.chev'); if(ch) ch.textContent=nu?'▲':'▼'; return; }
    const lg=e.target.closest('button[data-log]');
    if(lg){ await stuurLog(lg.dataset.log==='probleem'); return; }
    const gz=e.target.closest('button[data-gezien]');
    if(gz){ try{ await S.db.doc('orders/'+S.orderId+'/checks/'+gz.dataset.gezien).set({done:true,by:who(),uid:S.uid,at:new Date().toISOString()}); toast('Bedankt, wijziging gezien'); }catch(err){ fail(err); } return; }
    const op=e.target.closest('button[data-opgelost]');
    if(op){ try{ await S.db.doc('orders/'+S.orderId+'/log/'+op.dataset.opgelost).update({opgelost:true,opgelostDoor:who(),opgelostAt:new Date().toISOString()}); toast('Gemarkeerd als opgelost'); }catch(err){ fail(err); } }
  });
  document.addEventListener('change',async e=>{
    const sel=e.target.closest('select[data-uid]'); if(sel){ await setRolFor(sel.dataset.uid, sel.value); return; }
    const tv=e.target.closest('input[data-tel]'); if(tv){ if(tv.value!=='') await zetVoorraad(tv.dataset.tel,tv.value); return; }
    const chk=e.target.closest('input[type=checkbox][data-item]'); if(chk){ await toggle(chk.dataset.item,chk.checked,chk); return; }
    const td=e.target.closest('input[type=checkbox][data-todo]'); if(td){ const v=S.voertuigen[td.dataset.todo]; if(!v) return; const todo=(v.todo||[]).map((t,i)=>i===Number(td.dataset.i)?Object.assign({},t,{done:td.checked,at:new Date().toISOString()}):t); try{ await S.db.doc('voertuigen/'+v.key).update({todo}); }catch(err){ td.checked=!td.checked; fail(err); } return; }
    const f=e.target.closest('input[type=file][data-step]'); if(f&&f.files&&f.files[0]){ await addPhoto(f.dataset.step,f.files[0]); f.value=''; }
  });
  document.addEventListener('input',e=>{ if(e.target.id==='koppelMc') koppelZoek(); if(e.target.id==='zoekV'){ S.zoekV=e.target.value; clearTimeout(S._zt); S._zt=setTimeout(()=>{ const el=$('zoekV'); const pos=el?el.selectionStart:0; render(); const n=$('zoekV'); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(err){} } },250); } });
  document.addEventListener('submit',async e=>{
    if(e.target.id==='snelForm'){ e.preventDefault(); const raw=($('snelTag').value||'').trim(); const d=raw.replace(/\D/g,''); if(!raw){ toast('Typ het stickernummer of de meldcode.'); return; }
      if(/[A-Za-z]/.test(raw)){ location.hash='#'+kKey(raw); return; } if(d.length<=3){ location.hash='#t'+d.padStart(2,'0'); return; } if(d.length===4){ location.hash='#'+d; return; } location.hash='#'+d; return; }
    if(e.target.id==='nieuwAutoForm'){ e.preventDefault(); await nieuweAuto(e.target); return; }
    if(e.target.classList.contains('bewerk')&&e.target.dataset.key){ e.preventDefault(); await slaAutoOp(e.target); }
  });
  async function importeer(){
    const t=$('importJson'), msg=$('importMsg'); let d;
    try{ d=JSON.parse((t.value||'').trim()); }catch(e){ msg.textContent='Dit is geen geldige tekst. Plak precies wat Claude je gaf.'; return; }
    msg.textContent='Bezig…'; let n=0;
    try{
      for(const o of (d.orders||[])){ if(!o.nummer) continue; await S.db.doc('orders/'+String(o.nummer)).set(o); n++; }
      for(const v of [...(d.voertuigen||[]),...(d.archief||[]).map(x=>Object.assign({},x,{fase:'archief'}))]){ if(!v.key) continue; const ref=S.db.doc('voertuigen/'+v.key); const cur=await ref.get(); const {tag,...rest}=v; await ref.set(cur.exists?rest:{...rest,tag:tag||''},{merge:true}); n++; }
      for(const [id,aantal] of Object.entries(d.voorraad||{})){ const ref=S.db.doc('voorraad/'+id); if(!(await ref.get()).exists){ await ref.set({aantal,by:'Spéciale45 (startwaarde)',at:new Date().toISOString()}); n++; } }
      if(d.voorraadlijst){ await S.db.doc('lijsten/voorraad').set(d.voorraadlijst); n++; }
      for(const [nr,w] of Object.entries(d.wijzigingen||{})){ await S.db.doc('orders/'+nr).update({wijzigingen:firebase.firestore.FieldValue.arrayUnion(...[].concat(w))}); n++; }
      t.value=''; msg.textContent='Klaar: '+n+' onderdelen ingelezen.'; toast('Ingelezen');
    }catch(err){ msg.textContent='Mislukt: '+(err&&err.message||err); }
  }
  async function stuurLog(probleem){
    const t=$('logText'), txt=(t&&t.value||'').trim(); if(!txt){ toast('Typ eerst wat je wilt doorgeven.'); return; }
    try{ await S.db.collection('orders/'+S.orderId+'/log').add({tekst:txt,by:who(),rol:S.role,uid:S.uid,at:new Date().toISOString(),probleem,opgelost:false}); t.value=''; toast(probleem?'Probleem gemeld aan Spéciale45':'Verstuurd'); }catch(err){ fail(err); }
  }
  async function setRolFor(uid,rol){
    try{ if(rol) await S.db.doc('rollen/'+uid).set({rol, door:S.uid, at:new Date().toISOString()}); else await S.db.doc('rollen/'+uid).delete(); toast(rol?'Rol gegeven: '+rol:'Toegang ingetrokken'); }
    catch(err){ fail(err); }
  }
  async function toggle(id,checked,el){
    if(!S.db) return;
    const ref=S.db.doc('orders/'+S.orderId+'/checks/'+id);
    try{ if(checked) await ref.set({done:true,by:who(),uid:S.uid,at:new Date().toISOString()}); else await ref.delete();
      const it=S.order&&(S.order.stappen||[]).flatMap(st=>st.items||[]).find(x=>x.id===id); if(checked&&it&&(it.telt||[]).length) S.tel[id]=true; else delete S.tel[id]; render(); }
    catch(err){ el.checked=!checked; fail(err); }
  }
  function verklein(file){ // foto verkleinen tot een compacte jpeg (data-URL), zodat hij in de database past
    return new Promise(res=>{ const img=new Image(); const u=URL.createObjectURL(file);
      img.onload=()=>{ URL.revokeObjectURL(u); let max=1280, q=0.78, out='';
        for(let i=0;i<6;i++){ const r=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*r); c.height=Math.round(img.height*r); c.getContext('2d').drawImage(img,0,0,c.width,c.height); out=c.toDataURL('image/jpeg',q); if(out.length<650000) break; max=Math.round(max*0.8); q=Math.max(0.55,q-0.08); }
        res(out); };
      img.onerror=()=>{ URL.revokeObjectURL(u); res(''); }; img.src=u; });
  }
  async function addPhoto(stepId,file){
    if(!S.db) return;
    toast('Foto wordt opgeslagen…');
    try{ const data=await verklein(file); if(!data){ toast('Kon de foto niet lezen.'); return; }
      await S.db.collection('orders/'+S.orderId+'/photos').add({stap:stepId,data,by:who(),uid:S.uid,at:new Date().toISOString()}); toast('Foto toegevoegd'); }
    catch(err){ fail(err); }
  }
  function fail(err){
    const c=err&&err.code;
    if(c==='permission-denied'||c==='storage/unauthorized'){ toast('Geen rechten. Log opnieuw in.'); }
    else if(c==='unavailable'||c==='storage/retry-limit-exceeded') toast('Geen verbinding, probeer zo nog eens.');
    else toast('Opslaan mislukt, probeer opnieuw.');
  }

  // ── data ──
  function clearSubs(){ S.unsub.forEach(u=>{ try{u();}catch(e){} }); S.unsub=[]; }
  function subscribe(){
    clearSubs(); if(!S.db||!S.role) return;
    S.unsub.push(S.db.collection('voorraad').onSnapshot(snap=>{ const m={}; snap.docs.forEach(d=>{ if(d.exists) m[d.id]=d.data(); }); S.voorraad=m; render(); },()=>{}));
    S.unsub.push(S.db.collection('tags').onSnapshot(snap=>{ const m={}; snap.docs.forEach(d=>{ if(d.exists) m[d.id]=d.data(); }); S.tags=m; if(S.route&&S.route.tag){ S.tagDoc=m[S.route.tag]||null; resolveRoute(); } render(); },()=>{}));
    if(S.route&&!S.route.order&&!S.orderId){ // sticker of kenteken: auto opzoeken
      S.unsub.push(S.db.collection('voertuigen').onSnapshot(snap=>{ const m={}; snap.docs.forEach(d=>{ if(d.exists) m[d.id]=Object.assign({key:d.id},d.data()); }); S.voertuigen=m; resolveRoute(); render(); },()=>{}));
      S.unsub.push(S.db.collection('orders').onSnapshot(snap=>{ S.alle=snap.docs.filter(d=>d.exists).map(d=>Object.assign({id:d.id},d.data())); S.ordersGeladen=true; resolveRoute(); render(); },()=>{ S.ordersGeladen=true; render(); }));
      return;
    }
    if(!S.orderId){
      if(isS45()) S.unsub.push(S.db.collection('voertuigen').onSnapshot(snap=>{ const m={}; snap.docs.forEach(d=>{ if(d.exists) m[d.id]=Object.assign({key:d.id},d.data()); }); S.voertuigen=m; S.voertuigenGeladen=true; render(); },()=>{ S.voertuigenGeladen=true; render(); }));
      S.unsub.push(S.db.collection('orders').onSnapshot(snap=>{
        const seen=new Set(S.orders.map(o=>o.id));
        S.orders=snap.docs.filter(d=>d.exists).map(d=>{ const prev=S.orders.find(x=>x.id===d.id)||{}; return Object.assign({id:d.id,_checks:prev._checks||{},_log:prev._log||[],_photos:prev._photos||[],_sub:prev._sub},d.data()); });
        S.orders.forEach(o=>{ if(o._sub) return; o._sub=true;
          S.unsub.push(S.db.collection('orders/'+o.id+'/checks').onSnapshot(cs=>{ const m={}; cs.docs.forEach(c=>{ if(c.exists) m[c.id]=c.data(); }); const t=S.orders.find(x=>x.id===o.id); if(t){ t._checks=m; if(!S.orderId) render(); } },()=>{}));
          S.unsub.push(S.db.collection('orders/'+o.id+'/log').onSnapshot(ls=>{ const t=S.orders.find(x=>x.id===o.id); if(t){ t._log=ls.docs.filter(d=>d.exists).map(d=>d.data()); if(!S.orderId) render(); } },()=>{}));
          S.unsub.push(S.db.collection('orders/'+o.id+'/photos').onSnapshot(ps=>{ const t=S.orders.find(x=>x.id===o.id); if(t){ t._photos=ps.docs.filter(d=>d.exists).map(d=>d.data()); if(!S.orderId) render(); } },()=>{})); });
        render(); },()=>render()));
      return;
    }
    const base='orders/'+S.orderId;
    S.unsub.push(S.db.doc(base).onSnapshot(snap=>{ S.order=snap.exists?snap.data():null; if(!snap.exists){ setTop('Order '+S.orderId,'<a class="back" href="#" id="back">← Alle orders</a>',null); $('main').innerHTML=`<div class="empty">Deze order bestaat niet of je hebt er geen toegang toe.</div>`; return; } render(); },()=>render()));
    S.unsub.push(S.db.collection(base+'/checks').onSnapshot(snap=>{ const m={}; snap.docs.forEach(d=>{ if(d.exists) m[d.id]=d.data(); }); S.checks=m; if(S.order) render(); },()=>{}));
    S.unsub.push(S.db.collection(base+'/photos').orderBy('at','asc').onSnapshot(snap=>{ S.photos=snap.docs.filter(d=>d.exists).map(d=>Object.assign({id:d.id},d.data())); if(S.order) render(); },()=>{}));
    S.unsub.push(S.db.collection(base+'/log').orderBy('at','desc').limit(100).onSnapshot(snap=>{ S.log=snap.docs.filter(d=>d.exists).map(d=>Object.assign({id:d.id},d.data())); if(S.order) render(); },()=>{}));
  }
  function resolveRoute(){ // sticker/kenteken → lopende order
    const r=S.route; if(!r||r.order||!S.alle) return;
    let key=r.kenteken||(S.tagDoc?kKey(S.tagDoc.kenteken||S.tagDoc.key):''); let mc=r.meldcode||(S.tagDoc&&S.tagDoc.meldcode)||(/^MC\d{4}$/.test(key)?key.slice(2):'');
    if(r.meldcode){ const v=Object.values(S.voertuigen).find(x=>x.meldcode===mc); if(v) key=v.key; }
    if(!key&&!mc) return;
    const kand=S.alle.filter(o=>(key&&kKey(o.kenteken)===key)||(mc&&o.meldcode===mc)).sort((a,b)=>String(b.nummer).localeCompare(String(a.nummer)));
    if(kand.length&&S.orderId!==kand[0].nummer){ S.orderId=kand[0].nummer; resetOrderState(); subscribe(); render(); }
  }
  S.route=parseHash(); S.routeKey=JSON.stringify(S.route); S.orderId=S.route&&S.route.order?S.route.order:null;
  render();
  // ── Firebase ──
  try{ firebase.initializeApp(window.FIREBASE_CONFIG); }catch(e){}
  S.db=firebase.firestore();
  try{ S.db.enablePersistence({synchronizeTabs:true}).catch(()=>{}); }catch(e){}
  firebase.auth().onAuthStateChanged(u=>{
    S.authReady=true; S.uid=u?u.uid:null; const rol=u?rolVanEmail(u.email||''):'';
    const changed=rol!==S.role; S.role=rol; if(!rol) clearSubs();
    if(changed) subscribe(); render();
  });
  document.addEventListener('click',async e=>{
    const rb=e.target.closest('.login button[data-rol]'); if(rb){ S.loginRol=rb.dataset.rol; render(); return; }
    if(e.target.closest('#loginBtn')){ await login(); return; }
    if(e.target.closest('#rolTag')){ const now=Date.now(); if(S._uit&&now-S._uit<3000){ S._uit=0; try{ await firebase.auth().signOut(); toast('Uitgelogd'); }catch(err){} } else { S._uit=now; toast('Nog een keer tikken om uit te loggen'); } return; }
  });
  document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target&&e.target.id==='pin') login(); });
})();
</script>
